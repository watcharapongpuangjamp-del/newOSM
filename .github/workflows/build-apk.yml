name: Build Android APK & Release

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (both, debug หรือ release)'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - debug
          - release
      create_release:
        description: 'สร้าง GitHub Release พร้อมแนบ APK ให้ดาวน์โหลด (เมื่อกดรันด้วยมือหรือ Tag)'
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 📦 Setup Android SDK & Accept Licenses
        run: |
          echo "Accepting Android SDK licenses..."
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true
          echo "Installing Android SDK platforms & build-tools (including 36.0.0)..."
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0"

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📦 Install Node Dependencies, Typecheck & Build Web Bundle
        run: |
          echo "Installing Node dependencies (pinned Capacitor 8 versions)..."
          if [ -f package-lock.json ]; then
            npm ci --include=dev --no-audit
          else
            npm install --include=dev --no-audit
          fi

          echo "Running TypeScript check..."
          npm run lint

          echo "Building Vite web bundle..."
          npm run build

          echo "Verifying web bundle in dist/..."
          ls -la dist/

      - name: 📱 Sync Capacitor Android
        run: |
          if [ ! -f "capacitor.config.json" ]; then
            echo '{"appId": "th.in.smartosm.app", "appName": "Smart OSM Next", "webDir": "dist"}' > capacitor.config.json
          fi

          if [ ! -d "android" ] || [ ! -f "android/build.gradle" ]; then
            echo "Scaffolding Capacitor Android platform..."
            npx cap add android --no-interactive
          fi

          if [ ! -f "android/app/google-services.json" ] && [ -f "app/google-services.json" ]; then
            echo "Copying app/google-services.json to android/app/google-services.json..."
            cp app/google-services.json android/app/google-services.json
          fi

          echo "Syncing web assets and plugins to Capacitor Android..."
          npx cap sync android

          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
          fi

          echo "✓ Capacitor Android synced successfully"
          ls -la android/app/src/main/assets/public/

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: android
          cache-read-only: false

      - name: 🔐 Setup Signing Keystore for Release
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/smartosm-release.keystore"

          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$KEYSTORE_PATH"
            echo "KEYSTORE_FILE=$KEYSTORE_PATH" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=${{ secrets.STORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
            echo "✓ Using release keystore from GitHub Secrets"
          else
            echo "Generating ephemeral CI signing keystore for Release APK..."
            keytool -genkey -v -keystore "$KEYSTORE_PATH" \
              -keyalg RSA -keysize 2048 \
              -validity 10000 -alias smartosm \
              -storepass smartosm123 -keypass smartosm123 \
              -dname "CN=Smart OSM Release,O=Public Health,C=TH"
            echo "KEYSTORE_FILE=$KEYSTORE_PATH" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=smartosm123" >> $GITHUB_ENV
            echo "KEY_ALIAS=smartosm" >> $GITHUB_ENV
            echo "KEY_PASSWORD=smartosm123" >> $GITHUB_ENV
            echo "✓ Generated self-signed CI keystore"
          fi

      - name: 🔨 Build Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          BUILD_CHOICE="${{ inputs.build_type || 'both' }}"
          echo "Building Android APKs (Choice: $BUILD_CHOICE)..."

          if [ "$BUILD_CHOICE" = "both" ] || [ "$BUILD_CHOICE" = "debug" ]; then
            echo "Compiling Debug APK with Gradle..."
            ./gradlew assembleDebug --stacktrace --no-daemon
          fi

          if [ "$BUILD_CHOICE" = "both" ] || [ "$BUILD_CHOICE" = "release" ]; then
            echo "Compiling signed Release APK with Gradle..."
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file="$KEYSTORE_FILE" \
              -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASSWORD" \
              --stacktrace --no-daemon
          fi

      - name: 📂 Collect & Rename APK Files
        id: collect
        run: |
          mkdir -p output-apks
          DATE_STR=$(date +'%Y%m%d')
          SHA_SHORT=$(git rev-parse --short HEAD 2>/dev/null || echo "latest")

          find android/app/build/outputs/apk -type f -name "*.apk" ! -name "*-unsigned.apk" 2>/dev/null | sort -u | while read -r file; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              echo "Found APK: $file"

              if [[ "$filename" == *"release"* ]]; then
                NEW_NAME="Smart_OSM_Next-v${DATE_STR}-${SHA_SHORT}-release.apk"
              elif [[ "$filename" == *"debug"* ]]; then
                NEW_NAME="Smart_OSM_Next-v${DATE_STR}-${SHA_SHORT}-debug.apk"
              else
                NEW_NAME="Smart_OSM_Next-${filename}"
              fi

              cp "$file" "output-apks/$NEW_NAME"
              echo "✓ Copied to: output-apks/$NEW_NAME"
            fi
          done

          if [ -z "$(ls -A output-apks/*.apk 2>/dev/null)" ]; then
            echo "❌ Error: No signed APK files found in android/app/build/outputs/apk"
            exit 1
          fi

          echo "=== Summary of output APKs ==="
          ls -lh output-apks/

      - name: 📤 Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Smart_OSM_Next-APK-Build-${{ github.sha }}
          path: output-apks/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: 🚀 Publish GitHub Release with APK
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.create_release == true || inputs.create_release == 'true'))
        uses: softprops/action-gh-release@v2
        with:
          files: output-apks/*.apk
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('release-{0}', github.sha) }}
          name: 📱 Smart OSM Next APK - ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('Build {0}', github.sha) }}
          draft: false
          prerelease: false
          body: |
            ### 📱 Smart OSM Next - Android APK Package

            ระบบ Smart OSM สำหรับจัดการข้อมูล อสม. ครัวเรือน และประชากร พร้อมสแกน QR Code, แผนที่สุขภาพชุมชน GIS, และ AI ผู้ช่วย อสม.

            - **Commit SHA**: `${{ github.sha }}`
            - **Branch/Tag**: `${{ github.ref_name }}`
            - **วันที่สร้าง**: $(date +'%Y-%m-%d %H:%M:%S UTC')

            #### 📥 ดาวน์โหลดไฟล์ติดตั้ง:
            - ดาวน์โหลดไฟล์ `.apk` จากรายการ Assets ด้านล่างนี้เพื่อนำไปติดตั้งบนโทรศัพท์หรือแท็บเล็ต Android ได้ทันที
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📊 Job Summary
        if: always()
        run: |
          echo "### 📱 ผลการ Build APK" >> $GITHUB_STEP_SUMMARY
          echo "- **Event**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Ref**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### รายการไฟล์ APK ที่สร้างเสร็จ:" >> $GITHUB_STEP_SUMMARY
          for f in output-apks/*.apk; do
            if [ -f "$f" ]; then
              SIZE=$(ls -lh "$f" | awk '{print $5}')
              NAME=$(basename "$f")
              echo "- 📦 **$NAME** ($SIZE)" >> $GITHUB_STEP_SUMMARY
            fi
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "👉 *สามารถดาวน์โหลดไฟล์ APK ได้จากส่วน **Artifacts** ด้านล่างของหน้ารายงานนี้*" >> $GITHUB_STEP_SUMMARY
